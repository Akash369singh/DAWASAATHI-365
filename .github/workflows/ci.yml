name: DawaSaathi 365 CI / CD Quality Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          JWT_SECRET: ci-test-secret-key-32-chars-long-abc
          ALLOW_DEV_RESET: "false"
        run: |
          PYTHONPATH=. pytest tests/ -v

  frontend-test-and-build:
    name: Frontend Test & Production Build (Vitest & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Vitest Unit & Accessibility Tests
        run: npm run test

      - name: Verify Production Vite Build
        env:
          VITE_API_URL: https://dawasaathi-365.onrender.com
        run: npm run build
